<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบผลการประเมินมาตรฐานฯ 3S</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <h1>ระบบตรวจสอบผลการประเมินมาตรฐานฯ 3S</h1>
            <div class="header-badge">ปีงบประมาณ พ.ศ. 2569</div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="search-panel">
            <form id="searchForm">
                <section>
                    <label class="label-title">ประเภทหน่วยงาน</label>
                    <div class="type-selector">
                        <input type="radio" id="all" name="org_type" value="all" checked>
                        <label for="all">ทั้งหมด</label>
                        <input type="radio" id="sbt" name="org_type" value="ศบต">
                        <label for="sbt">ศบต.</label>
                        <input type="radio" id="sst" name="org_type" value="ศสต">
                        <label for="sst">ศสต.</label>
                    </div>
                </section>

                <section>
                    <label for="region" class="label-title">เลือกเขต</label>
                    <select id="region" name="region">
                        <option value="">-- กำลังโหลดข้อมูล --</option>
                    </select>
                </section>

                <section>
                    <label for="province" class="label-title">เลือกจังหวัด</label>
                    <select id="province" name="province">
                        <option value="">-- ทั้งหมด --</option>
                    </select>
                </section>

                <div class="button-group">
                    <button type="submit" class="btn-search">
                        <span>🔍</span> ค้นหาข้อมูล
                    </button>
                    <button type="reset" id="btnReset" class="btn-reset">
                        <span>🔄</span> ล้างค่า
                    </button>
                </div>
            </form>
        </aside>

        <section class="result-panel">
            <div id="resultArea">
                <div class="placeholder-content">
                    <div class="icon-bg">📊</div>
                    <p>กรุณาเลือกเงื่อนไขและกดปุ่มค้นหาเพื่อดูข้อมูล</p>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
